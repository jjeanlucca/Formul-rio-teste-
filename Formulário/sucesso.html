<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cadastro realizado</title>
  <link rel="stylesheet" href="css.css">
</head>
<body>
  <main class="card">
    <h1>✅ Cadastro realizado com sucesso!</h1>
    <p id="mensagem"></p>
    <a href="index.html">
      <button id="voltar">Voltar para o início</button>
    </a>
  </main>

  <script>
    // pega o nome salvo e coloca na mensagem
    const nome = localStorage.getItem("usuarioNome");
    const msg = document.getElementById("mensagem");

    if (nome) {
      msg.textContent = `Parabéns, ${nome}! Seu cadastro foi concluído.`;
    } else {
      msg.textContent = "Seu cadastro foi concluído.";
    }

    // ao voltar, limpa o nome do localStorage
    document.getElementById("voltar").addEventListener("click", () => {
      localStorage.removeItem("usuarioNome");
    });
  </script>
</body>
</html>
